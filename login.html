<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Password Generator</title>
        <link href="login.css" rel="stylesheet">
        <link href="Projects/password generator/ImagesPASSWD">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        
    </head>
    <body >
        <h1 style="color: #023e8a; text-align: center; font-family: Georgia, 'Times New Roman', Times, serif" >Log In</h1>
        <h4 style="text-align: center; color: #023e8a;">>Dues_Sentinel</h4>
        <hr width="100%">
        <div class="top-section">
            <div class="flex-container">
            <div class="status">
            <h3>>Initiate System</h3>
            <h3>STATUS: ONLINE</h3>
            <h3>ACCESS: AUTHENTICATION REQUIRED</h3>
        </div>
        </div>
      
        <div class="center-section">
            <div class="welcome-text">
                    <h2 style="text-align: center; margin-top: 25px;">Welcome, developer.</h2>
                    <h2>Log in to access your projects.</h2>
                </div>
            
             <div class="whole-container">
                

            <form class="login-form"> 

                <div class = "form_email">
                    <label for="name" >Email</label>
                    <input name="email" , type="email" , id = "email", placeholder="Enter your email" required>
                </div>

                <div class="form-username">
                    <label for="name"  >Username</label>
                    <input name="name" , type="name" , id = "username", placeholder="Enter your username" required>
                </div>

                <div class="form-password">
                    <br>
                    <label for="password">Password</label>   
                    <input name="password" id = "password" type="password" placeholder="Enter your password" required>
<br><br>
                    <a style = "font-size:medium;" href="" class="forgot-password" style="text-align: center;font-size: 20px;">Forgot Password?</a>
                    <br><br>
                    <a style = "font-size:medium;" href="login.html" class="forgot-password" style="text-align: center;font-size: 20px;">Already Have An Account?</a>
                    <br><br><br>
                    <button type="submit" class = "login-button">Log In</button>
                </div>

            </form>
            </div>

        </div>
        </div>
        
           
        
        
             
            
     
    </body>
</html>
