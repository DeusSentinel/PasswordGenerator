<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Password Generator</title>
        <link href="pass.css" rel="stylesheet">
        <link href="Projects/password generator/ImagesPASSWD">
    </head>
    <body >
        <h1 style="color:white; text-align: center; font-family: 'Courier New', Courier, monospace;" >Sign In</h1>
        <hr width="100%">
        <nav>
            <ul style="margin-left: 58px;"><a href="#">Home</a></ul> 
            <ul><a href="#">Password Generator</a></ul>
            <ul><a href="#">Contact</a></ul>
        </nav>
        <div class="whole-container">
            <form class="login-form"> 
                <div class="form-username">
                    <br>
                    <label for="name" style="font-size: 20px;">USERNAME</label>
                    <br><br>
                    <input 
                    name="name"
                    type="name"
                    id = "username"
                    placeholder="Enter your username"
                    required
                    >
                </div>
                <div class="form-password">
                    <br>
                    <label for="password" style="font-size: 20px;">PASSWORD</label>
                    <br><br>
                    <input name="password" id = "password" type="password" placeholder="Enter your password" required>
<br><br><br>
                    <a href="#" class="forgot-password" style="text-align: center;font-size: 20px;">Forgot Password?</a>
                    <br><br><br>
                    <button type="submit" class = "login-button">Log In</button>
            </div>

            </form>
            

            
            
        </div>
    </body>
</html>
