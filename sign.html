<html lang="en">
    <head>

    <body >
        <h1 style="color:black; text-align: center; font-family: Georgia, 'Times New Roman', Times, serif" >Sign Up</h1>
        <hr width="100%">
       
        
            <div class="whole-container">
            <form class="login-form"> 
                <div class="form-username">
        
                    <label for="name" style="font-size: 20px; color: black; ">Username/Email</label>
                    <input 
                    name="name"
                    type="name"
                    id = "username"
                    placeholder="Enter your username"
                    required
                    >
                </div>
                <div class="form-password">
                    <br>
                    <label for="password" style="font-size: 20px; color: black;;">Password</label>
                    
                    <input name="password" id = "password" type="password" placeholder="Enter your password" required>
<br><br>
                    <a style = "font-size:medium;" href="" class="forgot-password" style="text-align: center;font-size: 20px;">Forgot Password?</a>
                    <br><br>
                    <a style = "font-size:medium;" href="login.html" class="forgot-password" style="text-align: center;font-size: 20px;">Create An Account</a>
                    <br><br><br>
                    <button type="submit" class = "login-button">Log In</button>
                </div>

            </div>

            </form>
             
            
     
    </body>
